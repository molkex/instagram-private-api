name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic pytest
      - name: Run basic module imports
        run: |
          python -c "import instagramflow; print(instagramflow.__version__)"
          python -c "from instagramflow import InstagramAPI, ThreadsAPI"

  test-typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install and build TypeScript package
        run: |
          cd ts
          npm install
          npm run build
      - name: Verify compiled artifacts
        run: |
          cd ts
          node -e "const { InstagramAPI, MediaModule } = require('./dist'); console.log(MediaModule.pkFromCode('CGgDsi7JQdS'));"
